# Tushare Pro 分钟行情备用源。
name: tushare
display_name: "Tushare Pro"
runtime: none
entry: app.plugins.tushare.provider:TushareProvider
check: app.plugins.tushare.provider:availability
datasets: [minute]
api_key_env: TUSHARE_TOKEN
description: "Tushare Pro 历史分钟 K 备用数据源；需要单独开通分钟权限，默认不改变现有数据源。"
install_hint: "在 Tushare Pro 账户中创建 Token，并在此处配置；分钟数据需单独开通权限。"
homepage: "https://tushare.pro"
key_manage_url: "https://tushare.pro/user/token"
key_manage_label: "打开 Tushare Token 管理"
usage_notes:
  - "分钟接口按单标的时间窗口请求，平台会串行限速并逐段安全落盘。"
  - "Tushare 分钟数据需单独开通权限，普通积分不等同于分钟权限。"
